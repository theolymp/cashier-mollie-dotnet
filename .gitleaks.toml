# gitleaks configuration: the default rules plus one for Sentry/GlitchTip DSNs, which
# gitleaks v8.21.2 does not detect on its own.
title = "cashier-mollie-dotnet gitleaks"

[extend]
useDefault = true

[[rules]]
id = "sentry-glitchtip-dsn"
description = "Sentry/GlitchTip DSN with key (https://<key>[:<secret>]@<host>/<project-id>)"
regex = '''https?://[0-9a-f]{32}(?::[0-9a-f]{32})?@[A-Za-z0-9.-]+/[0-9]+'''
tags = ["dsn", "sentry", "glitchtip"]
