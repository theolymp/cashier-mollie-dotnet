# Secret scan over the full history of the checked-out branch.
#
# Its own workflow, on purpose: it does not depend on any other job, so a red build cannot skip it
# and a secret pushed together with a broken build is still found.
# `--log-opts=HEAD` limits the scan to the history of what is being checked; without it gitleaks v8
# scans every fetched ref, and a finding in someone else's open branch would turn every PR red.
# Known, harmless findings are listed by fingerprint, with the reason, in .gitleaksignore.
name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, otherwise only the last commit is scanned

      - name: gitleaks (pinned by digest)
        run: |
          test -f .gitleaks.toml || { echo "::error::.gitleaks.toml is missing"; exit 2; }
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            --entrypoint gitleaks \
            zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path gitleaks-report.json --log-opts=HEAD .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30
