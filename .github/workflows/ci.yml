name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # A vulnerability scan that only runs on push answers "was this commit clean when it was
  # pushed", not "is the published package clean today" -- and those differ, because the advisory
  # database moves while the code stands still. This repository is routinely idle for weeks with
  # two versions live on nuget.org, so without a timer the shipped package is never re-examined.
  # Measured 2026-10-26: the last run for the current HEAD was eight days old, and the only reason
  # anyone knew the dependencies were still clean was a scan run by hand.
  #
  # Monday 04:17 UTC, deliberately off the hour: scheduled jobs queue on a shared pool and the
  # top of the hour is the worst slot. The publish job cannot fire here -- it is gated on
  # refs/tags/v*, which a schedule event never carries -- so a timed run builds, tests and scans
  # and can publish nothing.
  #
  # GitHub disables scheduled workflows in public repositories after 60 days without repository
  # activity, and the Actions UI does so quietly -- a silent timer and a clean scan look identical
  # from outside. Since 2026-11-07 that is checked rather than only written down: the step
  # "Check the weekly scan timer is still alive" reads this workflow's `state` from the API, where
  # `disabled_inactivity` is one of the values, and fails the run when the timer is off.
  #
  # What that step cannot cover, because it runs inside the workflow it measures: if automatic
  # disabling stops the push trigger too -- the documentation does not say -- there is no run to
  # report it, and the symptom is a commit with no checks at all rather than a red one.
  schedule:
    - cron: '17 4 * * 1'

# The SDK version is deliberately NOT declared here. It lives in global.json, and both jobs
# install it from that file. A floating '10.0.x' resolves to whatever is newest on the runner,
# which combined with TreatWarningsAsErrors means a new analyzer rule can turn main red without
# anyone touching the code -- that happened on 2026-07-27 (CA1873). One version, one place.
# Supersede a still-running check when a newer commit arrives on the same ref, so an obsolete run
# cannot report a verdict for a state nobody is on any more.
#
# cancel-in-progress is deliberately FALSE for tags: a tag run performs the NuGet publish, and
# publishing is not resumable or reversible -- a cancellation mid-push could leave a version
# half-released. Branch and PR runs only build and test, so interrupting them costs nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Spelled out rather than inherited, because one step reads the Actions API: the workflow's
    # own state, to tell a live weekly timer from a dead one. `actions: read` is what that needs,
    # and naming the whole set keeps the default (which a repository setting can widen to
    # write-all) out of the decision.
    permissions:
      contents: read
      actions: read

    # A real PostgreSQL, because both known consumers deploy on it and the same model resolves
    # decimal differently per provider (numeric here, TEXT on SQLite, decimal(18,2) on SQL Server).
    # A money calculation verified only on SQLite is verified on the wrong engine.
    #
    # And a real SQL Server, because that is where the same model resolves decimal to
    # decimal(18,2) and rounds. No consumer deploys on it, which is precisely why it was the gap:
    # the provider nobody runs is the provider nobody notices, and it is the one that silently
    # changes an amount. Both passwords here are throwaway credentials for an ephemeral container
    # that nothing outside this job can reach -- they are not secrets and do not belong in the
    # secret store, where they would only make the workflow harder to read.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Cashier_ci_pw1
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        # SQL Server needs noticeably longer than PostgreSQL to accept logins, hence the retries.
        # The sqlcmd path is version-specific and was read out of this exact image tag rather than
        # assumed: /opt/mssql-tools18/bin/sqlcmd. -C trusts the self-signed certificate, which the
        # client otherwise rejects because it encrypts by default.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Cashier_ci_pw1 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # The SDK still comes from global.json alone. The second line installs only what the net10.0
      # half of the test matrix needs to RUN: the library and its tests target net10.0 and net11.0,
      # SDK 11 builds both, but a net10.0 test host needs the .NET 10 runtime, which SDK 11 does
      # not bring. global.json keeps selecting the SDK, so the floating '10.0.x' cannot reach the
      # compiler and cannot repeat 2026-07-27. The publish job does not need it: packing compiles
      # for net10.0 without running anything on it.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      # Known advisories in dependencies, direct and transitive. This can turn main red without
      # anyone touching the code -- an advisory published today applies to yesterday's build. That
      # is accepted deliberately: unlike the analyzer breakage this workflow saw on 2026-07-27,
      # which came from an unpinned toolchain and was avoidable noise, a new advisory is real and
      # actionable information about a package we publish.
      - name: Scan dependencies for known vulnerabilities
        run: .github/scan-vulnerable.sh

      # Both supply-chain steps sit before Build on purpose, like the scan above. Steps inside a
      # job are strictly ordered, so putting them in front of the compile is the only way to keep
      # the evidence independent of whether the build or the tests pass -- a red test must not be
      # able to suppress the SBOM, and a step that never ran is counted as present by anyone
      # taking stock from the outside.
      - name: Generate SBOM and check third-party licenses
        run: .github/sbom-licenses.sh

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          # 90 days is an operational figure, not a retention period for evidence.
          #
          # What it is long enough for: investigating a release after the fact, holding a finding
          # against the state of the day it was published, bisecting a regression. That is triage.
          #
          # What it is nowhere near long enough for -- the more important half: an SBOM is usually
          # asked for as technical documentation covering a product's support period, which runs
          # to years. Whoever takes these artifacts for that record does not have one; two
          # versions of this package are live on nuget.org and their BOMs will be gone from here
          # long before they are.
          #
          # So: do not shorten it because 90 looks generous, and do not lengthen it in the belief
          # that doing so discharges a retention duty. Both would be wrong for different reasons.
          retention-days: 90

      # Asks whether the weekly timer above is still running, because nothing else here would
      # notice if it stopped. GitHub disables scheduled workflows in public repositories after 60
      # days of inactivity, and a dead timer looks exactly like a clean scan from outside -- the
      # caveat written next to the `schedule:` block, now measured instead of only warned about:
      # `disabled_inactivity` is a value of the workflow's `state` field.
      #
      # Deliberately after the scan and the SBOM upload, for the same reason those sit before
      # Build: a step cannot suppress evidence that was already produced. And deliberately NOT
      # gated on the event -- if automatic disabling also stops the push trigger (the GitHub
      # documentation does not say either way), a pull_request run may be the only place this can
      # still be asked.
      - name: Check the weekly scan timer is still alive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/schedule-liveness.sh

      # Evidence that the PathMap on the publish job's Pack step actually removes the build path
      # -- run here, on every push, because the publish job only fires on a tag and evidence that
      # first appears during a release is evidence nobody can act on.
      #
      # continue-on-error, deliberately: build-and-test is a `needs` of publish, so a failure in
      # the MEASUREMENT would tear down the release path. A peer session lost nine build jobs to
      # exactly that. The finding still surfaces -- `::error::` and `::warning::` become
      # annotations, which the API serves without a token, so a green step with no annotation
      # from this check is the "proven" tier and nothing else.
      - name: Check the shipped assembly carries no absolute build path
        continue-on-error: true
        run: .github/build-path-check.sh

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The provider slices run first and on their own, because `dotnet test` exits 0 for passed,
      # for all-skipped and for zero matching tests alike -- measured 2026-10-04. The exit code
      # therefore cannot tell "verified against this provider" from "measured nothing", and these
      # tests skip by design when their connection string is absent. test-must-run.sh reads the
      # passed count out of the output, the same way scan-vulnerable.sh reads its findings rather
      # than trusting a status.
      - name: Test against PostgreSQL (must actually run, not skip)
        env:
          CASHIERMOLLIE_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Username=postgres;Password=ci;Database=postgres"
        run: .github/test-must-run.sh 'FullyQualifiedName~PostgresTranslationTests' 'PostgreSQL translation tests'

      # TrustServerCertificate is required, not cosmetic: Microsoft.Data.SqlClient encrypts by
      # default and rejects the container's self-signed certificate, so without it every test here
      # fails on the connection rather than on anything it measures.
      - name: Test against SQL Server (must actually run, not skip)
        env:
          CASHIERMOLLIE_TEST_SQLSERVER: "Server=127.0.0.1,1433;Database=master;User Id=sa;Password=Cashier_ci_pw1;TrustServerCertificate=True"
        run: .github/test-must-run.sh 'FullyQualifiedName~SqlServerTranslationTests' 'SQL Server translation tests'

      - name: Test
        env:
          CASHIERMOLLIE_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Username=postgres;Password=ci;Database=postgres"
          CASHIERMOLLIE_TEST_SQLSERVER: "Server=127.0.0.1,1433;Database=master;User Id=sa;Password=Cashier_ci_pw1;TrustServerCertificate=True"
        run: dotnet test --no-build --configuration Release --verbosity normal

  # PRECONDITION, and it is the whole risk of this job: nuget.org must carry a trusted-publishing
  # policy for this repository before a tag is cut. Owner theolymp, repository
  # cashier-mollie-dotnet, workflow file ci.yml, environment release. Without it NuGet/login fails
  # and nothing is published -- loudly, which is the point. The API-key path it replaced had the
  # opposite failure mode: it carried `if: env.NUGET_API_KEY != ''`, so a tag with no secret
  # configured produced a green run that published nothing at all.
  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Not decoration. The environment is where a required reviewer is attached, which turns "only
    # publish after a go-ahead" from a convention into something the runner enforces -- and a
    # NuGet version number is permanent, so that gate is worth having in the mechanism.
    environment: release
    permissions:
      # The OIDC token NuGet/login exchanges for a short-lived key. Without it the login fails 403.
      id-token: write
      # Stated explicitly because naming any permission drops the defaults for the rest. The
      # previous `packages: write` is gone: nothing here pushes to GitHub Packages, only to
      # api.nuget.org, so it granted a scope this job never used.
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # PathMap at the step that creates the SHIPPED artifact, with the root taken from the
      # environment rather than typed: a hardcoded path would map a directory the compiler never
      # saw, and the flag would then be set, succeed, and change nothing.
      #
      # What it fixes: this assembly is published to nuget.org and ends up inside a consumer's
      # release image, carrying `/home/runner/work/cashier-mollie-dotnet/...` with it -- measured
      # as exactly one string, the PDB path in the PE debug directory. Already-published versions
      # are immutable, so 0.3.0 and 0.4.0 keep theirs; this takes effect from the next tag.
      - name: Pack
        run: dotnet pack src/CashierMollie/CashierMollie.csproj --configuration Release --output ./nupkg -p:PathMap=$GITHUB_WORKSPACE=.

      # The blocking half of the build-path check, and the only place it belongs: it measures the
      # .nupkg that is about to be pushed, not one it packed itself, and a push is irreversible --
      # a version number cannot be reused. No continue-on-error here, and STRICT=1, so a surviving
      # build path or a verdict that could not be formed stops the release instead of shipping a
      # package that carries this runner's directory layout into every consumer's image.
      - name: Verify the package about to be published carries no build path
        env:
          STRICT: "1"
        run: |
          MAPPED_PACKAGE="$(ls ./nupkg/*.nupkg | head -1)" .github/build-path-check.sh

      # Deliberately after Pack and immediately before the push: the exchanged key is short-lived,
      # and a login that sits an hour ahead of the thing it authorises is a failure waiting for a
      # slow build.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          # The nuget.org PROFILE NAME, not the e-mail address. An environment secret rather than
          # a literal so the account it publishes as is not readable from a public workflow.
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
