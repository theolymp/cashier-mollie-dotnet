name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# The SDK version is deliberately NOT declared here. It lives in global.json, and both jobs
# install it from that file. A floating '10.0.x' resolves to whatever is newest on the runner,
# which combined with TreatWarningsAsErrors means a new analyzer rule can turn main red without
# anyone touching the code -- that happened on 2026-07-27 (CA1873). One version, one place.
# Supersede a still-running check when a newer commit arrives on the same ref, so an obsolete run
# cannot report a verdict for a state nobody is on any more.
#
# cancel-in-progress is deliberately FALSE for tags: a tag run performs the NuGet publish, and
# publishing is not resumable or reversible -- a cancellation mid-push could leave a version
# half-released. Branch and PR runs only build and test, so interrupting them costs nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A real PostgreSQL, because both known consumers deploy on it and the same model resolves
    # decimal differently per provider (numeric here, TEXT on SQLite, decimal(18,2) on SQL Server).
    # A money calculation verified only on SQLite is verified on the wrong engine.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      # Known advisories in dependencies, direct and transitive. This can turn main red without
      # anyone touching the code -- an advisory published today applies to yesterday's build. That
      # is accepted deliberately: unlike the analyzer breakage this workflow saw on 2026-07-27,
      # which came from an unpinned toolchain and was avoidable noise, a new advisory is real and
      # actionable information about a package we publish.
      - name: Scan dependencies for known vulnerabilities
        run: .github/scan-vulnerable.sh

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Runs first and on its own, because `dotnet test` exits 0 for passed, for all-skipped and
      # for zero matching tests alike -- measured 2026-10-04. The exit code therefore cannot tell
      # "verified against PostgreSQL" from "measured nothing", and these tests skip by design when
      # CASHIERMOLLIE_TEST_POSTGRES is absent. So the count is read out of the output, the same way
      # scan-vulnerable.sh reads its findings rather than trusting a status.
      - name: Test against PostgreSQL (must actually run, not skip)
        env:
          CASHIERMOLLIE_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Username=postgres;Password=ci;Database=postgres"
        run: |
          dotnet test --no-build --configuration Release --verbosity normal \
            --filter 'FullyQualifiedName~PostgresTranslationTests' 2>&1 | tee pg-tests.log
          passed=$(sed -n 's/.*Passed: *\([0-9][0-9]*\).*/\1/p' pg-tests.log | tail -1)
          if [ -z "$passed" ]; then
            echo "::error::No Passed count in the output -- the run reported none, so nothing is verified."
            exit 1
          fi
          if [ "$passed" -lt 1 ]; then
            echo "::error::PostgreSQL tests did not run ($passed passed). They skip when CASHIERMOLLIE_TEST_POSTGRES is unset or the service container is unreachable; a skipped test and a passing one look the same in a summary line, which is why this is asserted."
            exit 1
          fi
          echo "PostgreSQL translation tests ran: $passed passed."

      - name: Test
        env:
          CASHIERMOLLIE_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Username=postgres;Password=ci;Database=postgres"
        run: dotnet test --no-build --configuration Release --verbosity normal

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/CashierMollie/CashierMollie.csproj --configuration Release --output ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
