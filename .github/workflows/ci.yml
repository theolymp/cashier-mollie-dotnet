name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# The SDK version is deliberately NOT declared here. It lives in global.json, and both jobs
# install it from that file. A floating '10.0.x' resolves to whatever is newest on the runner,
# which combined with TreatWarningsAsErrors means a new analyzer rule can turn main red without
# anyone touching the code -- that happened on 2026-07-27 (CA1873). One version, one place.
# Supersede a still-running check when a newer commit arrives on the same ref, so an obsolete run
# cannot report a verdict for a state nobody is on any more.
#
# cancel-in-progress is deliberately FALSE for tags: a tag run performs the NuGet publish, and
# publishing is not resumable or reversible -- a cancellation mid-push could leave a version
# half-released. Branch and PR runs only build and test, so interrupting them costs nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/CashierMollie/CashierMollie.csproj --configuration Release --output ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
